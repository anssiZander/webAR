<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A-Frame WebAR Demo</title>

<!-- A-Frame Library -->

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

<!-- AR.js for A-Frame -->

<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<script>

AFRAME.registerComponent('trefoil-knot', {

schema: {

size: { type: 'number', default: 2 },

tubeRadius: { type: 'number', default: 0.16 },

color: { type: 'color', default: '#F5B642' }

},

init() {

const data = this.data;

class TrefoilCurve extends THREE.Curve {

getPoint(t) {

const angle = t * Math.PI * 2;

return new THREE.Vector3(

Math.sin(angle) + 2 * Math.sin(2 * angle),

Math.cos(angle) - 2 * Math.cos(2 * angle),

-Math.sin(3 * angle)

);

}

}

const curve = new TrefoilCurve();

const geometry = new THREE.TubeGeometry(curve, 192, data.tubeRadius, 18, true);

geometry.computeBoundingBox();

const box = geometry.boundingBox;

const rawSize = new THREE.Vector3();

box.getSize(rawSize);

const scale = data.size / Math.max(rawSize.x, rawSize.y, rawSize.z);

geometry.scale(scale, scale, scale);

geometry.computeBoundingBox();

const normalizedBox = geometry.boundingBox;

const centerX = (normalizedBox.min.x + normalizedBox.max.x) / 2;

const centerZ = (normalizedBox.min.z + normalizedBox.max.z) / 2;

geometry.translate(-centerX, -normalizedBox.min.y, -centerZ);

const material = new THREE.MeshStandardMaterial({

color: data.color,

roughness: 0.38,

metalness: 0.18

});

const mesh = new THREE.Mesh(geometry, material);

this.el.setObject3D('mesh', mesh);

},

remove() {

this.el.removeObject3D('mesh');

}

});

</script>


<style>

body { margin: 0; overflow: hidden; font-family: sans-serif; }

#ui-overlay {

position: absolute;

top: 10px;

left: 10px;

z-index: 10;

background: rgba(0, 0, 0, 0.7);

color: white;

padding: 15px;

border-radius: 8px;

max-width: 250px;

pointer-events: none;

}

.marker-guide {

border: 2px solid #00ff00;

width: 150px;

height: 150px;

position: absolute;

top: 50%;

left: 50%;

transform: translate(-50%, -50%);

pointer-events: none;

opacity: 0.5;

}

</style>

</head>

<body>


<!-- UI Information Overlay -->

<div id="ui-overlay">

<h2 style="margin-top:0">WebAR Demo</h2>

<p>1. Point your camera at a <strong>Hiro marker</strong> or <strong>Barcode marker #5</strong>.</p>

<p>2. The Hiro marker shows the video cube. Barcode #5 shows a larger trefoil knot.</p>

<p style="font-size: 0.8em; color: #aaa;">Status: <span id="status">Waiting for Marker...</span></p>

</div>


<!-- Visual Guide for the User -->

<div class="marker-guide"></div>


<!--

A-Scene setup:

- embedded: keeps it within the div/body

- arjs: initializes the AR engine

- vr-mode-ui: disabled because we are using the phone screen as the view, not a headset

-->

<a-scene

embedded

arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"

vr-mode-ui="enabled: false">


<!-- Define the Assets (Materials, Models) -->

<a-assets>

<video
id="cube-video"
src="./video.mp4"
preload="auto"
autoplay
loop
muted
playsinline
webkit-playsinline>
</video>

</a-assets>


<!--A-Marker: The anchor for the AR content.

"preset: hiro" uses the standard hiro pattern.

-->

<a-marker preset="hiro" id="main-marker">


<!-- A 3D Box that appears when the marker is found -->

<a-box

position="0 0.5 0"

material="src: #cube-video; shader: flat; color: #FFFFFF; transparent: false; opacity: 1">

</a-box>


<!-- A rotating ring around the base -->

<a-ring

color="#EF2D5E"

radius-inner="0.6"

radius-outer="0.7"

rotation="-90 0 0"

animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 1000">

</a-ring>


</a-marker>


<a-marker type="barcode" value="5" id="barcode-marker">


<!-- A larger procedural trefoil knot that appears when Barcode marker #5 is found -->

<a-entity

position="0 0 0"

trefoil-knot="size: 2; tubeRadius: 0.16; color: #F5B642">

</a-entity>


</a-marker>


<!-- Static camera that moves according to the marker position -->

<a-entity camera></a-entity>


</a-scene>


<script>

// Simple logic to update the UI status based on marker detection

const markers = document.querySelectorAll('a-marker');

const statusText = document.querySelector('#status');

const cubeVideo = document.querySelector('#cube-video');

const visibleMarkers = new Set();


function playCubeVideo() {

cubeVideo.muted = true;

cubeVideo.play().catch((error) => {

console.warn('Video playback was blocked:', error);

});

}


markers.forEach((marker) => {

marker.addEventListener('markerFound', () => {

visibleMarkers.add(marker.id);

statusText.innerText = visibleMarkers.size === 1 ? "1 Marker Found!" : `${visibleMarkers.size} Markers Found!`;

statusText.style.color = "#00ff00";

playCubeVideo();

});


marker.addEventListener('markerLost', () => {

visibleMarkers.delete(marker.id);

statusText.innerText = visibleMarkers.size === 0 ? "Waiting for Marker..." : `${visibleMarkers.size} Marker Still Found!`;

statusText.style.color = visibleMarkers.size === 0 ? "#aaa" : "#00ff00";

});

});


playCubeVideo();

</script>

</body>

</html>
