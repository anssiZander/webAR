<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A-Frame WebAR Demo</title>

<!-- A-Frame Library -->

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

<!-- AR.js for A-Frame -->

<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<script>

AFRAME.registerComponent('trefoil-knot', {

schema: {

size: { type: 'number', default: 2 },

tubeRadius: { type: 'number', default: 0.16 },

color: { type: 'color', default: '#F5B642' }

},

init() {

const data = this.data;

class TrefoilCurve extends THREE.Curve {

getPoint(t) {

const angle = t * Math.PI * 2;

return new THREE.Vector3(

Math.sin(angle) + 2 * Math.sin(2 * angle),

Math.cos(angle) - 2 * Math.cos(2 * angle),

-Math.sin(3 * angle)

);

}

}

const curve = new TrefoilCurve();

const geometry = new THREE.TubeGeometry(curve, 192, data.tubeRadius, 18, true);

geometry.computeBoundingBox();

const box = geometry.boundingBox;

const rawSize = new THREE.Vector3();

box.getSize(rawSize);

const scale = data.size / Math.max(rawSize.x, rawSize.y, rawSize.z);

geometry.scale(scale, scale, scale);

geometry.computeBoundingBox();

const normalizedBox = geometry.boundingBox;

const centerX = (normalizedBox.min.x + normalizedBox.max.x) / 2;

const centerZ = (normalizedBox.min.z + normalizedBox.max.z) / 2;

geometry.translate(-centerX, -normalizedBox.min.y, -centerZ);

const material = new THREE.MeshStandardMaterial({

color: data.color,

roughness: 0.18,

metalness: 0.85,

emissive: new THREE.Color('#4A3300'),

emissiveIntensity: 0.25

});

const mesh = new THREE.Mesh(geometry, material);

this.el.setObject3D('mesh', mesh);

},

remove() {

this.el.removeObject3D('mesh');

},

tick(time) {

this.el.object3D.rotation.y = time / 1000 * 0.44;

this.el.object3D.rotation.x = Math.sin(time / 1000 * 0.24) * 0.12;

}

});

AFRAME.registerComponent('hologram-torus', {

schema: {

size: { type: 'number', default: 2 },

color: { type: 'color', default: '#42F5FF' }

},

init() {

const data = this.data;

const geometry = new THREE.BoxGeometry(data.size, data.size, data.size);

const material = new THREE.ShaderMaterial({

transparent: false,

depthWrite: true,

blending: THREE.NormalBlending,

side: THREE.FrontSide,

uniforms: {

time: { value: 0 },

halfSize: { value: data.size / 2 },

cameraLocalPosition: { value: new THREE.Vector3(0, 0, 4) },

hologramColor: { value: new THREE.Color(data.color) }

},

vertexShader: `
varying vec3 vLocalPosition;

void main() {
  vLocalPosition = position;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`,

fragmentShader: `
precision highp float;

uniform float time;
uniform float halfSize;
uniform vec3 cameraLocalPosition;
uniform vec3 hologramColor;

varying vec3 vLocalPosition;

float sdTorus(vec3 p, vec2 torus) {
  vec2 q = vec2(length(p.xz) - torus.x, p.y);
  return length(q) - torus.y;
}

mat2 rotate2d(float angle) {
  float s = sin(angle);
  float c = cos(angle);
  return mat2(c, -s, s, c);
}

float mapScene(vec3 p) {
  p.xz = rotate2d(0.45 + time * 0.36) * p.xz;
  p.xy = rotate2d(-0.35 + time * 0.22) * p.xy;
  return sdTorus(p, vec2(halfSize * 0.48, halfSize * 0.16));
}

vec3 estimateNormal(vec3 p) {
  vec2 e = vec2(0.006, 0.0);
  return normalize(vec3(
    mapScene(p + e.xyy) - mapScene(p - e.xyy),
    mapScene(p + e.yxy) - mapScene(p - e.yxy),
    mapScene(p + e.yyx) - mapScene(p - e.yyx)
  ));
}

void main() {
  vec3 ro = cameraLocalPosition;
  vec3 rd = normalize(vLocalPosition - ro);
  vec3 p = vLocalPosition + rd * 0.015;

  float rayDistance = 0.0;
  float hit = 0.0;
  vec3 hitPoint = vec3(0.0);

  for (int i = 0; i < 72; i++) {
    vec3 samplePoint = p + rd * rayDistance;

    if (max(max(abs(samplePoint.x), abs(samplePoint.y)), abs(samplePoint.z)) > halfSize * 1.15) {
      break;
    }

    float d = mapScene(samplePoint);

    if (d < 0.008) {
      hit = 1.0;
      hitPoint = samplePoint;
      break;
    }

    rayDistance += clamp(abs(d) * 0.72, 0.018, 0.085);
  }

  vec3 normalColor = vec3(0.0);

  if (hit > 0.5) {
    vec3 normal = estimateNormal(hitPoint);
    normalColor = normal * 0.5 + 0.5;
  }

  vec3 blackWindow = vec3(0.0);
  vec3 color = mix(blackWindow, normalColor, hit);
  gl_FragColor = vec4(color, 1.0);
}
`

});

const mesh = new THREE.Mesh(geometry, material);

this.material = material;

this.el.setObject3D('mesh', mesh);

},

tick(time) {

if (!this.material) return;

const camera = this.el.sceneEl.camera;

if (camera) {

const cameraWorldPosition = new THREE.Vector3();

camera.getWorldPosition(cameraWorldPosition);

this.material.uniforms.cameraLocalPosition.value.copy(this.el.object3D.worldToLocal(cameraWorldPosition));

}

this.material.uniforms.time.value = time / 1000;

},

remove() {

this.el.removeObject3D('mesh');

}

});

AFRAME.registerComponent('stereographic-grid', {

schema: {

planeSize: { type: 'number', default: 3.4 },

sphereRadius: { type: 'number', default: 0.575 },

divisions: { type: 'int', default: 28 },

duration: { type: 'number', default: 3500 },

color: { type: 'color', default: '#8FEAFF' }

},

init() {

this.startedAt = null;

const data = this.data;

const divisions = data.divisions;

const segments = 2 * (divisions + 1) * divisions;

this.positions = new Float32Array(segments * 2 * 3);

const geometry = new THREE.BufferGeometry();

geometry.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));

const material = new THREE.LineBasicMaterial({

color: data.color,

transparent: true,

opacity: 0.92

});

const lines = new THREE.LineSegments(geometry, material);

this.geometry = geometry;

this.el.setObject3D('mesh', lines);

window.setTimeout(() => {

const marker = this.el.closest('a-marker');

if (marker) {

marker.addEventListener('markerFound', () => {

this.startedAt = null;

});

}

}, 0);

this.updateGrid(0);

},

smoothstep(value) {

const t = Math.min(Math.max(value, 0), 1);

return t * t * (3 - 2 * t);

},

projectPoint(x, z, progress) {

const data = this.data;

const radius = data.sphereRadius;

const projectionScale = data.planeSize * 0.28;

const u = x / projectionScale;

const v = z / projectionScale;

const denominator = u * u + v * v + 1;

const sphereX = radius * 2 * u / denominator;

const sphereY = radius * (u * u + v * v - 1) / denominator + radius;

const sphereZ = radius * 2 * v / denominator;

const planeY = 0.02;

return new THREE.Vector3(

THREE.MathUtils.lerp(x, sphereX, progress),

THREE.MathUtils.lerp(planeY, sphereY + 0.02, progress),

THREE.MathUtils.lerp(z, sphereZ, progress)

);

},

writePoint(index, point) {

this.positions[index] = point.x;

this.positions[index + 1] = point.y;

this.positions[index + 2] = point.z;

},

updateGrid(progress) {

const data = this.data;

const divisions = data.divisions;

const halfSize = data.planeSize / 2;

let offset = 0;

for (let row = 0; row <= divisions; row++) {

const z = -halfSize + (row / divisions) * data.planeSize;

for (let column = 0; column < divisions; column++) {

const x1 = -halfSize + (column / divisions) * data.planeSize;

const x2 = -halfSize + ((column + 1) / divisions) * data.planeSize;

this.writePoint(offset, this.projectPoint(x1, z, progress));

this.writePoint(offset + 3, this.projectPoint(x2, z, progress));

offset += 6;

}

}

for (let column = 0; column <= divisions; column++) {

const x = -halfSize + (column / divisions) * data.planeSize;

for (let row = 0; row < divisions; row++) {

const z1 = -halfSize + (row / divisions) * data.planeSize;

const z2 = -halfSize + ((row + 1) / divisions) * data.planeSize;

this.writePoint(offset, this.projectPoint(x, z1, progress));

this.writePoint(offset + 3, this.projectPoint(x, z2, progress));

offset += 6;

}

}

this.geometry.attributes.position.needsUpdate = true;

this.geometry.computeBoundingSphere();

},

tick(time) {

if (this.startedAt === null) {

this.startedAt = time;

}

const cycle = ((time - this.startedAt) / this.data.duration) % 2;

const pingPong = cycle <= 1 ? cycle : 2 - cycle;

const progress = this.smoothstep(pingPong);

this.updateGrid(progress);

},

remove() {

this.el.removeObject3D('mesh');

}

});

</script>


<style>

body { margin: 0; overflow: hidden; font-family: sans-serif; }

#ui-overlay {

position: absolute;

top: 10px;

left: 10px;

z-index: 10;

background: rgba(0, 0, 0, 0.7);

color: white;

padding: 15px;

border-radius: 8px;

max-width: 250px;

pointer-events: none;

}

.marker-guide {

border: 2px solid #00ff00;

width: 150px;

height: 150px;

position: absolute;

top: 50%;

left: 50%;

transform: translate(-50%, -50%);

pointer-events: none;

opacity: 0.5;

}

</style>

</head>

<body>


<!-- UI Information Overlay -->

<div id="ui-overlay">

<h2 style="margin-top:0">WebAR Demo</h2>

<p>1. Point your camera at a <strong>Hiro marker</strong>, <strong>Barcode marker #5</strong>, <strong>Kanji marker</strong>, or <strong>Barcode marker #20</strong>.</p>

<p>2. Hiro shows the video cube. Barcode #5 shows a trefoil knot. Kanji shows a torus window. Barcode #20 shows a stereographic grid.</p>

<p style="font-size: 0.8em; color: #aaa;">Status: <span id="status">Waiting for Marker...</span></p>

</div>


<!-- Visual Guide for the User -->

<div class="marker-guide"></div>


<!--

A-Scene setup:

- embedded: keeps it within the div/body

- arjs: initializes the AR engine

- vr-mode-ui: disabled because we are using the phone screen as the view, not a headset

-->

<a-scene

embedded

arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"

vr-mode-ui="enabled: false">


<!-- Define the Assets (Materials, Models) -->

<a-assets>

<video
id="cube-video"
src="./video.mp4"
preload="auto"
autoplay
loop
muted
playsinline
webkit-playsinline>
</video>

<audio
id="background-music"
src="./Another%20World.mp3"
preload="auto"
loop>
</audio>

</a-assets>


<!--A-Marker: The anchor for the AR content.

"preset: hiro" uses the standard hiro pattern.

-->

<a-marker preset="hiro" id="main-marker">


<!-- A 3D Box that appears when the marker is found -->

<a-box

position="0 0.5 0"

material="src: #cube-video; shader: flat; color: #FFFFFF; transparent: false; opacity: 1">

</a-box>

<a-text

value="Double Slit experiment in Bohmian mechanics"

position=".5 0.04 1"

rotation="-90 0 0"

align="left"

anchor="left"

color="#FF00FF"

width="3.4">

</a-text>


<!-- A rotating ring around the base -->

<a-ring

color="#EF2D5E"

radius-inner="0.6"

radius-outer="0.7"

rotation="-90 0 0"

animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 1000">

</a-ring>


</a-marker>


<a-marker type="barcode" value="5" id="barcode-marker">


<!-- A larger procedural trefoil knot that appears when Barcode marker #5 is found -->

<a-entity

position="0 0 0"

trefoil-knot="size: 2; tubeRadius: 0.32; color: #D4AF37">

</a-entity>

<a-text

value="Metallic trefoil knot"

position="-1 0.04 1"

rotation="-90 0 0"

align="left"

anchor="left"

color="#FFE08A"

width="4">

</a-text>


</a-marker>


<a-marker preset="kanji" id="kanji-marker">


<!-- A shader cube volume that raymarches a hologram torus on the Kanji marker -->

<a-entity

position="0 1 0"

hologram-torus="size: 2; color: #00B85C">

</a-entity>

<a-text

value="Normal-shaded torus window"

position="-1 0.04 -1"

rotation="0 180 0"

align="left"

anchor="left"

color="#8DFFB0"

width="4">

</a-text>


</a-marker>


<a-marker type="barcode" value="20" id="projection-marker">


<!-- A plane grid that slowly wraps onto a sphere by inverse stereographic projection -->

<a-entity

position="0 0 0"

stereographic-grid="planeSize: 6.8; sphereRadius: 0.575; divisions: 28; duration: 3500; color: #8FEAFF">

</a-entity>

<a-text

value="Stereographic projection grid"

position="-1 0.04 1"

rotation="-90 0 0"

align="left"

anchor="left"

color="#AEEFFF"

width="4">

</a-text>


</a-marker>


<!-- Static camera that moves according to the marker position -->

<a-entity camera></a-entity>


</a-scene>


<script>

// Simple logic to update the UI status based on marker detection

const markers = document.querySelectorAll('a-marker');

const statusText = document.querySelector('#status');

const cubeVideo = document.querySelector('#cube-video');

const backgroundMusic = document.querySelector('#background-music');

const visibleMarkers = new Set();


function playCubeVideo() {

cubeVideo.muted = true;

cubeVideo.play().catch((error) => {

console.warn('Video playback was blocked:', error);

});

}


function playBackgroundMusic() {

backgroundMusic.volume = 0.2;

backgroundMusic.play().catch((error) => {

console.warn('Background music playback was blocked:', error);

});

}


function retryBackgroundMusicOnGesture() {

if (!backgroundMusic.paused) return;

playBackgroundMusic();

}


markers.forEach((marker) => {

marker.addEventListener('markerFound', () => {

visibleMarkers.add(marker.id);

statusText.innerText = visibleMarkers.size === 1 ? "1 Marker Found!" : `${visibleMarkers.size} Markers Found!`;

statusText.style.color = "#00ff00";

playCubeVideo();

});


marker.addEventListener('markerLost', () => {

visibleMarkers.delete(marker.id);

statusText.innerText = visibleMarkers.size === 0 ? "Waiting for Marker..." : `${visibleMarkers.size} Marker Still Found!`;

statusText.style.color = visibleMarkers.size === 0 ? "#aaa" : "#00ff00";

});

});


playCubeVideo();

playBackgroundMusic();

window.addEventListener('pointerdown', retryBackgroundMusicOnGesture, { once: true });

window.addEventListener('touchstart', retryBackgroundMusicOnGesture, { once: true });

</script>

</body>

</html>
