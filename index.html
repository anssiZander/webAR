<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A-Frame WebAR Demo</title>

<!-- A-Frame Library -->

<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

<!-- AR.js for A-Frame -->

<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<script>

AFRAME.registerComponent('trefoil-knot', {

schema: {

size: { type: 'number', default: 2 },

tubeRadius: { type: 'number', default: 0.16 },

color: { type: 'color', default: '#F5B642' }

},

init() {

const data = this.data;

class TrefoilCurve extends THREE.Curve {

getPoint(t) {

const angle = t * Math.PI * 2;

return new THREE.Vector3(

Math.sin(angle) + 2 * Math.sin(2 * angle),

Math.cos(angle) - 2 * Math.cos(2 * angle),

-Math.sin(3 * angle)

);

}

}

const curve = new TrefoilCurve();

const geometry = new THREE.TubeGeometry(curve, 192, data.tubeRadius, 18, true);

geometry.computeBoundingBox();

const box = geometry.boundingBox;

const rawSize = new THREE.Vector3();

box.getSize(rawSize);

const scale = data.size / Math.max(rawSize.x, rawSize.y, rawSize.z);

geometry.scale(scale, scale, scale);

geometry.computeBoundingBox();

const normalizedBox = geometry.boundingBox;

const centerX = (normalizedBox.min.x + normalizedBox.max.x) / 2;

const centerZ = (normalizedBox.min.z + normalizedBox.max.z) / 2;

geometry.translate(-centerX, -normalizedBox.min.y, -centerZ);

const material = new THREE.MeshPhysicalMaterial({

color: data.color,

transparent: true,

opacity: 0.45,

roughness: 0.04,

metalness: 0.0,

transmission: 0.65,

thickness: 0.6,

clearcoat: 1.0,

clearcoatRoughness: 0.08,

ior: 1.45

});

const mesh = new THREE.Mesh(geometry, material);

this.el.setObject3D('mesh', mesh);

},

remove() {

this.el.removeObject3D('mesh');

}

});

AFRAME.registerComponent('hologram-torus', {

schema: {

size: { type: 'number', default: 2 },

color: { type: 'color', default: '#42F5FF' }

},

init() {

const data = this.data;

const geometry = new THREE.BoxGeometry(data.size, data.size, data.size);

const material = new THREE.ShaderMaterial({

transparent: true,

depthWrite: false,

blending: THREE.AdditiveBlending,

side: THREE.FrontSide,

uniforms: {

time: { value: 0 },

halfSize: { value: data.size / 2 },

cameraLocalPosition: { value: new THREE.Vector3(0, 0, 4) },

hologramColor: { value: new THREE.Color(data.color) }

},

vertexShader: `
varying vec3 vLocalPosition;

void main() {
  vLocalPosition = position;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`,

fragmentShader: `
precision highp float;

uniform float time;
uniform float halfSize;
uniform vec3 cameraLocalPosition;
uniform vec3 hologramColor;

varying vec3 vLocalPosition;

float sdTorus(vec3 p, vec2 torus) {
  vec2 q = vec2(length(p.xz) - torus.x, p.y);
  return length(q) - torus.y;
}

mat2 rotate2d(float angle) {
  float s = sin(angle);
  float c = cos(angle);
  return mat2(c, -s, s, c);
}

float mapScene(vec3 p) {
  p.xz = rotate2d(time * 0.65) * p.xz;
  p.xy = rotate2d(time * 0.28) * p.xy;
  return sdTorus(p, vec2(halfSize * 0.48, halfSize * 0.16));
}

void main() {
  vec3 ro = cameraLocalPosition;
  vec3 rd = normalize(vLocalPosition - ro);
  vec3 p = vLocalPosition + rd * 0.015;

  float rayDistance = 0.0;
  float glow = 0.0;
  float hit = 0.0;

  for (int i = 0; i < 72; i++) {
    vec3 samplePoint = p + rd * rayDistance;

    if (max(max(abs(samplePoint.x), abs(samplePoint.y)), abs(samplePoint.z)) > halfSize * 1.15) {
      break;
    }

    float d = mapScene(samplePoint);
    glow += 0.018 / (0.035 + abs(d));

    if (d < 0.008) {
      hit = 1.0;
      break;
    }

    rayDistance += clamp(abs(d) * 0.72, 0.018, 0.085);
  }

  float scanline = 0.62 + 0.38 * sin((vLocalPosition.y + time * 0.55) * 34.0);
  float intensity = clamp(hit * 1.55 + glow * 0.09, 0.0, 1.0);
  float alpha = clamp(intensity * scanline, 0.0, 0.95);

  if (alpha < 0.025) {
    discard;
  }

  vec3 color = hologramColor * (0.5 + intensity * 1.55);
  gl_FragColor = vec4(color, alpha);
}
`

});

const mesh = new THREE.Mesh(geometry, material);

this.material = material;

this.el.setObject3D('mesh', mesh);

},

tick(time) {

if (!this.material) return;

const camera = this.el.sceneEl.camera;

if (camera) {

const cameraWorldPosition = new THREE.Vector3();

camera.getWorldPosition(cameraWorldPosition);

this.material.uniforms.cameraLocalPosition.value.copy(this.el.object3D.worldToLocal(cameraWorldPosition));

}

this.material.uniforms.time.value = time / 1000;

},

remove() {

this.el.removeObject3D('mesh');

}

});

</script>


<style>

body { margin: 0; overflow: hidden; font-family: sans-serif; }

#ui-overlay {

position: absolute;

top: 10px;

left: 10px;

z-index: 10;

background: rgba(0, 0, 0, 0.7);

color: white;

padding: 15px;

border-radius: 8px;

max-width: 250px;

pointer-events: none;

}

.marker-guide {

border: 2px solid #00ff00;

width: 150px;

height: 150px;

position: absolute;

top: 50%;

left: 50%;

transform: translate(-50%, -50%);

pointer-events: none;

opacity: 0.5;

}

</style>

</head>

<body>


<!-- UI Information Overlay -->

<div id="ui-overlay">

<h2 style="margin-top:0">WebAR Demo</h2>

<p>1. Point your camera at a <strong>Hiro marker</strong>, <strong>Barcode marker #5</strong>, or <strong>Kanji marker</strong>.</p>

<p>2. Hiro shows the video cube. Barcode #5 shows a trefoil knot. Kanji shows a hologram torus.</p>

<p style="font-size: 0.8em; color: #aaa;">Status: <span id="status">Waiting for Marker...</span></p>

</div>


<!-- Visual Guide for the User -->

<div class="marker-guide"></div>


<!--

A-Scene setup:

- embedded: keeps it within the div/body

- arjs: initializes the AR engine

- vr-mode-ui: disabled because we are using the phone screen as the view, not a headset

-->

<a-scene

embedded

arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"

vr-mode-ui="enabled: false">


<!-- Define the Assets (Materials, Models) -->

<a-assets>

<video
id="cube-video"
src="./video.mp4"
preload="auto"
autoplay
loop
muted
playsinline
webkit-playsinline>
</video>

</a-assets>


<!--A-Marker: The anchor for the AR content.

"preset: hiro" uses the standard hiro pattern.

-->

<a-marker preset="hiro" id="main-marker">


<!-- A 3D Box that appears when the marker is found -->

<a-box

position="0 0.5 0"

material="src: #cube-video; shader: flat; color: #FFFFFF; transparent: false; opacity: 1">

</a-box>


<!-- A rotating ring around the base -->

<a-ring

color="#EF2D5E"

radius-inner="0.6"

radius-outer="0.7"

rotation="-90 0 0"

animation="property: scale; from: 1 1 1; to: 1.2 1.2 1.2; dir: alternate; loop: true; dur: 1000">

</a-ring>


</a-marker>


<a-marker type="barcode" value="5" id="barcode-marker">


<!-- A larger procedural trefoil knot that appears when Barcode marker #5 is found -->

<a-entity

position="0 0 0"

trefoil-knot="size: 2; tubeRadius: 0.32; color: #BFEFFF">

</a-entity>


</a-marker>


<a-marker preset="kanji" id="kanji-marker">


<!-- A shader cube volume that raymarches a hologram torus on the Kanji marker -->

<a-entity

position="0 2 0"

hologram-torus="size: 4; color: #00B85C">

</a-entity>


</a-marker>


<!-- Static camera that moves according to the marker position -->

<a-entity camera></a-entity>


</a-scene>


<script>

// Simple logic to update the UI status based on marker detection

const markers = document.querySelectorAll('a-marker');

const statusText = document.querySelector('#status');

const cubeVideo = document.querySelector('#cube-video');

const visibleMarkers = new Set();


function playCubeVideo() {

cubeVideo.muted = true;

cubeVideo.play().catch((error) => {

console.warn('Video playback was blocked:', error);

});

}


markers.forEach((marker) => {

marker.addEventListener('markerFound', () => {

visibleMarkers.add(marker.id);

statusText.innerText = visibleMarkers.size === 1 ? "1 Marker Found!" : `${visibleMarkers.size} Markers Found!`;

statusText.style.color = "#00ff00";

playCubeVideo();

});


marker.addEventListener('markerLost', () => {

visibleMarkers.delete(marker.id);

statusText.innerText = visibleMarkers.size === 0 ? "Waiting for Marker..." : `${visibleMarkers.size} Marker Still Found!`;

statusText.style.color = visibleMarkers.size === 0 ? "#aaa" : "#00ff00";

});

});


playCubeVideo();

</script>

</body>

</html>
